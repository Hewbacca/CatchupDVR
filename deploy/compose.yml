services:
  catchup:
    image: ghcr.io/hewbacca/catchupdvr:edge
    container_name: catchup-dvr
    restart: unless-stopped
    network_mode: host
    environment:
      HTTP_ADDR: :8095
      DATABASE_PATH: /data/catchup.db
      RECORDINGS_DIR: /recordings
      TUNER_COUNT: 2
      FFMPEG_PATH: ffmpeg
      GPU_MODE: auto
      PRE_PADDING_MINUTES: 2
      POST_PADDING_MINUTES: 5
      DEINTERLACE: "true"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./data:/data:Z
      - ./recordings:/recordings:Z
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8095/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
