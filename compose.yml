services:
  catchup:
    build: .
    container_name: catchup-dvr
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      HTTP_ADDR: :8080
      DATABASE_PATH: /data/catchup.db
      RECORDINGS_DIR: /recordings
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./data:/data:Z
      - ./recordings:/recordings:Z
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
